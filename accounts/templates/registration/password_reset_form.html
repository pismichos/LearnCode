{% extends "base.html" %}

{% block title %}
    Επαναφορά κωδικού | LearnCode
{% endblock %}

{% block content %}

<section class="py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 fw-bold mb-3">
                        Επαναφορά κωδικού
                    </h1>
                    <p class="text-muted">
                        Συμπλήρωσε το email του λογαριασμού σου.
                        Θα σου στείλουμε σύνδεσμο για δημιουργία νέου κωδικού.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Email
                            </label>
                            {{ form.email }}
                        </div>
                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Αποστολή συνδέσμου
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
