{% extends "base.html" %}

{% block title %}
    Νέος κωδικός | LearnCode
{% endblock %}

{% block content %}

<section class="py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow">
                <div class="card-body p-4">
                    <h1 class="h3 fw-bold mb-4">
                        Δημιουργία νέου κωδικού
                    </h1>
                    {% if validlink %}
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button
                                type="submit"
                                class="btn btn-primary w-100">
                                Αλλαγή κωδικού
                            </button>
                        </form>
                    {% else %}
                        <div class="alert alert-danger">
                            Ο σύνδεσμος επαναφοράς δεν είναι έγκυρος
                            ή έχει λήξει.
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
